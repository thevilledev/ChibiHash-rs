name: Test

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:
    inputs:
      debug_enabled:
        description: 'Run with debug logging enabled'
        type: boolean
        required: false
        default: false

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust toolchain
        shell: bash
        run: |
          rustup default stable
          rustup component add rustfmt clippy

      - name: Rust Cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 #v2.9.2

      - name: Lint
        run: make lint

      - name: Format check
        run: make fmt-check

      - name: Check compilation (std)
        run: cargo check --features std

      - name: Check compilation (no-std, zero deps)
        run: cargo check --no-default-features

      - name: Check compilation (hashbrown)
        run: cargo check --no-default-features --features hashbrown

      - name: Test (std)
        run: make test-std

      - name: Test (no-std, zero deps)
        run: make test-no-std

      - name: Test (hashbrown)
        run: make test-hashbrown
